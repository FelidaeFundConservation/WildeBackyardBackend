runtime: custom
env: flex
service: wildebackyard-api-staging

beta_settings:
  cloud_sql_instances: wildepod-339517:us-west2:wildepoddb

env_variables:
  DJANGO_SETTINGS_MODULE: "config.settings.staging"
  PYTHON_ENV: "staging"
  GOOGLE_CLOUD_PROJECT: "wildepod-339517"
  STAGING_DB_PASSWORD_SECRET_ID: "staging_db_password"
  STAGING_DB_PASSWORD_SECRET_VERSION: "latest"
  CLOUD_SQL_DATABASE_USER_STAGING: "wildepod_wildebackyard_api_user"
  CLOUD_SQL_DATABASE_NAME_STAGING: "wildebackyard_api_staging"
  CLOUD_SQL_CONNECTION_NAME: "wildepod-339517:us-west2:wildepoddb"

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 2
  cool_down_period_sec: 120
  cpu_utilization:
    target_utilization: 0.6

resources:
  cpu: 1
  memory_gb: 2
  disk_size_gb: 20

liveness_check:
  path: "/"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2

readiness_check:
  path: "/"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
  app_start_timeout_sec: 300
