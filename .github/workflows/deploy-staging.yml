# Deploy to GCP Staging Workflow
#
# This workflow deploys the application to Google Cloud Platform App Engine (staging environment).
#
# IMPORTANT: Branch Configuration
# - This workflow triggers MANUALLY ONLY
# - Use the "Run workflow" button in GitHub Actions to trigger a deployment
# - Production GCP deployments should use a separate workflow configured for production
#
# To enable this workflow:
# 1. Ensure GCP_SA_KEY secret is configured with service account credentials
# 2. Verify GCP_PROJECT_ID secret is set
# 3. Ensure staging.yaml file exists and is properly configured
# 4. Set up Cloud SQL instance and database
# 5. Grant Secret Manager permissions to the service account:
#    - Role: roles/secretmanager.secretAccessor
#    - See: gcp_deployment/GRANT_SECRET_MANAGER_PERMISSIONS.md for detailed instructions
# 6. Create secret in Google Secret Manager:
#    - Name: staging_db_password
#    - Value: Your database password
#
# For manual deployment, see: GCP_DEPLOYMENT_REFERENCE.md

name: Deploy to GCP Staging

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or commit SHA to deploy'
        required: false
        default: 'main'  # Changed from 'staging' to 'main'
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        default: 'false'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  ENVIRONMENT: staging
  PYTHON_VERSION: '3.10'
  DJANGO_SETTINGS_MODULE: config.settings.wildebackyard_api
  WEBSITE_HOSTNAME: ${{ secrets.WEBSITE_HOSTNAME }}

jobs:
  # Job 1: Run tests and quality checks using reusable workflow
  test:
    uses: ./.github/workflows/build-test-coverage.yml
    with:
      branch: ${{ github.event.inputs.branch || github.ref }}
      skip_tests: ${{ github.event.inputs.skip_tests == 'true' }}
    secrets: inherit

  # Job 2: Build and validate
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: test
    #    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || 
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
        
      - name: Update package list
        run: sudo apt-get update
        
      - name: Install Git and Build Tools
        # Use -y to automatically answer yes to prompts
        run: sudo apt-get install -y gdal-bin libgdal-dev libsqlite3-mod-spatialite libspatialite-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate GCP credentials
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "Error: GCP_SA_KEY secret is not set or is empty"
            echo "Please configure the GCP_SA_KEY secret in your repository settings:"
            echo "1. Go to Settings → Secrets and variables → Actions"
            echo "2. Add a new secret named 'GCP_SA_KEY'"
            echo "3. Paste the contents of your service account JSON key"
            echo ""
            echo "To create a service account key, follow the guide in gcp_deployment/DEPLOYMENT_GUIDE.md"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate app.yaml
        run: |
          if [ ! -f "app.yaml" ]; then
            echo "Error: app.yaml not found"
            exit 1
          fi

          # Basic YAML validation
          python -c "import yaml; yaml.safe_load(open('app.yaml'))"
          echo "✓ app.yaml is valid"

      - name: Check Cloud SQL instance
        run: |
          if gcloud sql instances describe wildepod-staging-db --project=$GCP_PROJECT_ID &> /dev/null; then
            echo "✓ Cloud SQL instance exists"
          else
            echo "Warning: Cloud SQL instance not found"
          fi

  # Job 3: Deploy to App Engine
  deploy:
    name: Deploy to App Engine
    runs-on: ubuntu-latest
    needs: [test, build]
#    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    if: ${{ always() }}
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
        
      - name: Update package list
        run: sudo apt-get update
        
      - name: Install Git and Build Tools
        # Use -y to automatically answer yes to prompts
        run: sudo apt-get install -y gdal-bin libgdal-dev libsqlite3-mod-spatialite libspatialite-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate GCP credentials
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "Error: GCP_SA_KEY secret is not set or is empty"
            echo "Please configure the GCP_SA_KEY secret in your repository settings:"
            echo "1. Go to Settings → Secrets and variables → Actions"
            echo "2. Add a new secret named 'GCP_SA_KEY'"
            echo "3. Paste the contents of your service account JSON key"
            echo ""
            echo "To create a service account key, follow the guide in gcp_deployment/DEPLOYMENT_GUIDE.md"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update version.py with deployment commit hash
        shell: bash
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          RELEASE_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "staging")

          # Export variables for Python to access
          export SHORT_HASH RELEASE_TAG

          python3 << 'PYTHON'
          import os
          short_hash = os.environ.get('SHORT_HASH', 'unknown')
          release_tag = os.environ.get('RELEASE_TAG', 'unknown')

          with open('config/version.py', 'w') as f:
              f.write('"""\n')
              f.write('Version information for the application.\n')
              f.write('This file is automatically updated by the GitHub Actions workflow during deployment.\n')
              f.write('"""\n')
              f.write('\n')
              f.write('VERSION = {\n')
              f.write(f'    "commit_hash": "{short_hash}",\n')
              f.write(f'    "release_tag": "{release_tag}",\n')
              f.write('}\n')
          print(f'✓ Updated version.py with commit hash: {short_hash} and release tag: {release_tag}')
          PYTHON

      - name: Collect static files
        continue-on-error: true
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          WILDEBACKYARD_API_DATABASE_URL: "postgres://dummy:dummy@localhost/dummy"
        run: |
          # Attempt to collect static files (dummy DB URL not needed for collectstatic)
          python manage.py collectstatic --noinput --settings=config.settings.wildebackyard_api || echo "Static collection skipped"

      - name: Deploy to App Engine
        run: |
          gcloud app deploy app.yaml \
            --project=$GCP_PROJECT_ID \
            --verbosity=debug \
            --no-promote \
            --version=$(echo $GITHUB_SHA | cut -c1-7)

      - name: Get deployment info
        id: deployment
        run: |
          VERSION=$(echo $GITHUB_SHA | cut -c1-7)
          URL="https://${VERSION}-dot-staging-dot-${GCP_PROJECT_ID}.appspot.com"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # Job 4: Run database migrations
  migrate:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
        
      - name: Update package list
        run: sudo apt-get update
        
      - name: Install Git and Build Tools
        # Use -y to automatically answer yes to prompts
        run: sudo apt-get install -y gdal-bin libgdal-dev libsqlite3-mod-spatialite libspatialite-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate GCP credentials
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "Error: GCP_SA_KEY secret is not set or is empty"
            echo "Please configure the GCP_SA_KEY secret in your repository settings:"
            echo "1. Go to Settings → Secrets and variables → Actions"
            echo "2. Add a new secret named 'GCP_SA_KEY'"
            echo "3. Paste the contents of your service account JSON key"
            echo ""
            echo "To create a service account key, follow the guide in gcp_deployment/DEPLOYMENT_GUIDE.md"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Cloud SQL Proxy
        run: |
          wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
          chmod +x cloud_sql_proxy

      - name: Run database migrations
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          # Get database password from Google Secret Manager
          DB_PASSWORD=$(gcloud secrets versions access latest --secret="wildebackyard_api_db_password" --project=$GCP_PROJECT_ID)
          
          # Get Cloud SQL connection name
          CONNECTION_NAME=$(gcloud sql instances describe wildepod-staging-db --project=$GCP_PROJECT_ID --format="value(connectionName)")

          # Start Cloud SQL Proxy in background
          ./cloud_sql_proxy -instances=${CONNECTION_NAME}=tcp:5440 &
          PROXY_PID=$!

          # Wait for proxy to be ready
          sleep 10

          # Set database URL for migrations via proxy
          # URL-encode the password for use in connection string
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse; print(urllib.parse.quote_plus('${DB_PASSWORD}'))")
          export WILDEBACKYARD_API_DATABASE_URL="postgres://wildepod_wildebackyard_api_user:${ENCODED_PASSWORD}@127.0.0.1:5440/wildebackyard_api_staging"

          # Run migrations with the same settings module as deployment
          python manage.py migrate --settings=config.settings.wildebackyard_api --noinput

          # Stop proxy
          kill $PROXY_PID || true

      - name: Create superuser (if needed)
        continue-on-error: true
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
        run: |
          # Only for initial setup - will fail if superuser exists
          # Get database password from Google Secret Manager
          DB_PASSWORD=$(gcloud secrets versions access latest --secret="staging_db_password" --project=$GCP_PROJECT_ID)
          
          CONNECTION_NAME=$(gcloud sql instances describe wildepod-staging-db --project=$GCP_PROJECT_ID --format="value(connectionName)")

          ./cloud_sql_proxy -instances=${CONNECTION_NAME}=tcp:5440 &
          PROXY_PID=$!
          sleep 10

          # URL-encode the password for use in connection string
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse; print(urllib.parse.quote_plus('${DB_PASSWORD}'))")
          export WILDEBACKYARD_API_DATABASE_URL="postgres://wildepod_wildebackyard_api_user:${ENCODED_PASSWORD}@127.0.0.1:5440/wildebackyard_api_staging"

          python manage.py createsuperuser --noinput \
            --username=admin \
            --email=admin@wildepod.org \
            --settings=config.settings.wildebackyard_api || echo "Superuser already exists"

          kill $PROXY_PID || true

  # Job 5: Smoke tests
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy, migrate]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Wait for deployment to be ready
        run: sleep 30

      - name: Check application health
        run: |
          VERSION=$(echo $GITHUB_SHA | cut -c1-7)
          URL="https://${VERSION}-dot-staging-dot-${GCP_PROJECT_ID}.appspot.com"

          # Check if site is up
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $URL || echo "000")

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "✓ Application is responding (HTTP $HTTP_CODE)"
          else
            echo "✗ Application health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Validate GCP credentials
        if: success()
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "Error: GCP_SA_KEY secret is not set or is empty"
            echo "Please configure the GCP_SA_KEY secret in your repository settings:"
            echo "1. Go to Settings → Secrets and variables → Actions"
            echo "2. Add a new secret named 'GCP_SA_KEY'"
            echo "3. Paste the contents of your service account JSON key"
            echo ""
            echo "To create a service account key, follow the guide in gcp_deployment/DEPLOYMENT_GUIDE.md"
            exit 1
          fi

      - name: Promote to staging
        if: success()
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Promote version
        run: |
          VERSION=$(echo $GITHUB_SHA | cut -c1-7)
          gcloud app services set-traffic staging \
            --splits=${VERSION}=1 \
            --project=$GCP_PROJECT_ID \
            --quiet

  # Job 6: Notify
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: always()

    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.smoke-test.result }}" = "success" ]; then
            echo "✅ Deployment to staging successful!"
            echo "URL: https://staging-dot-${GCP_PROJECT_ID}.appspot.com"
          else
            echo "❌ Deployment failed or was skipped"
            exit 1
          fi
