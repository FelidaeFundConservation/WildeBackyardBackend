name: Build, Test, and Coverage

on:
  push:
    branches: [ main, johnnovak/add_tests_and_fixes, copilot/add-media-upload-to-cloud ]
  pull_request:
    branches: [ main, johnnovak/add_tests_and_fixes ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test, and Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Update package list
        run: sudo apt-get update
        
      - name: Install Git and Build Tools
        # Use -y to automatically answer yes to prompts
        run: sudo apt-get install -y gdal-bin libgdal-dev
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run linting with flake8
        continue-on-error: true
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,migrations,staticfiles
          # Check for other issues
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,migrations,staticfiles

      - name: Run tests with coverage
        run: |
          # Run pytest with coverage
          pytest --cov=siteapps --cov-report=xml --cov-report=html --cov-report=term-missing -v
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Generate coverage badge
        run: |
          # Calculate coverage percentage
          COVERAGE=$(coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          echo "COVERAGE_PERCENT=${COVERAGE}" >> $GITHUB_ENV

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
            .coverage
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read coverage report
            let coverageOutput = '';
            try {
              const { execSync } = require('child_process');
              coverageOutput = execSync('coverage report', { encoding: 'utf-8' });
            } catch (e) {
              coverageOutput = 'Coverage report not available';
            }
            
            const comment = `## 📊 Test Coverage Report
            
            \`\`\`
            ${coverageOutput}
            \`\`\`
            
            **Coverage:** ${process.env.COVERAGE_PERCENT}%
            
            📁 [View detailed HTML report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Check coverage threshold
        run: |
          # Fail if coverage is below 70%
          COVERAGE=$(coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold of 70%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets threshold"
          fi

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependencies installed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests executed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Coverage report generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage: ${COVERAGE_PERCENT}%" >> $GITHUB_STEP_SUMMARY
