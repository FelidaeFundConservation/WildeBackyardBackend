runtime: custom
env: flex
service: wildebackyard-api

env_variables:
  DJANGO_SETTINGS_MODULE: "config.settings.wildebackyard_api"
  PYTHON_ENV: "production"
  CLOUD_SQL_CONNECTION_NAME: "wildepod-339517:us-west2:wildepoddb"
  WILDEBACKYARD_API_DATABASE_URL: "postgres://wildepod_wildebackyard_api_user:%2FnoABg6yCIUL5IMmueBRyYcqPMwvouxPBPXRbI%2BP%2BMU%3D@/wildebackyard_api_prod"
  # Mailgun SMTP — required for password reset and email verification emails.
  MAILGUN_SMTP_PASSWORD: "008d44ee941867754c5b5b8219d57fbc-03fd4b1a-5dc38526"
  # Web frontend URL — used for email confirmation redirect after account verification
  WEB_APP_URL: "https://wildebackyard-web-dot-wildepod-339517.wl.r.appspot.com"

# Cloud SQL configuration for flexible environment
beta_settings:
  cloud_sql_instances: "wildepod-339517:us-west2:wildepoddb"

# Flexible environment scaling
automatic_scaling:
  min_num_instances: 1
  max_num_instances: 1
  cool_down_period_sec: 120
  cpu_utilization:
    target_utilization: 0.5

resources:
  cpu: 1
  memory_gb: 0.5
  disk_size_gb: 10

liveness_check:
  path: "/"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2

readiness_check:
  path: "/"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
  app_start_timeout_sec: 300
